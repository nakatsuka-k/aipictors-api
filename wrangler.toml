name = "aipictors-api"
main = "src/index.ts"
compatibility_date = "2026-04-24"
account_id = "7f2a200bf2994f36f45e733751a30be6"
workers_dev = true

routes = [
	{ pattern = "backend.aipictors.com/healthz", zone_name = "aipictors.com" },
	{ pattern = "backend.aipictors.com/internal/*", zone_name = "aipictors.com" },
	{ pattern = "backend.aipictors.com/admin/*", zone_name = "aipictors.com" },
	{ pattern = "backend.aipictors.com/stripe/*", zone_name = "aipictors.com" },
	{ pattern = "backend.aipictors.com/webhooks/stripe", zone_name = "aipictors.com" }
]

[[d1_databases]]
binding = "AIPICTORS_DB"
database_name = "aipictors-api"
database_id = "b9394134-dd5e-4fc3-9b54-b2ef49463ff4"

[vars]
STRIPE_WEBHOOK_PATH = "/webhooks/stripe"

# Required secrets / vars (set via `wrangler secret put` or dashboard)
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# INTERNAL_API_TOKEN
# ADMIN_API_TOKEN
