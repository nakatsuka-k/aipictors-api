name = "aipictors-api"
main = "src/index.ts"
compatibility_date = "2026-04-24"
account_id = "7f2a200bf2994f36f45e733751a30be6"
# Custom hostnames are configured in the Cloudflare Dashboard (not here) so `wrangler deploy`
# does not need Zone → Workers Routes on the API token (fixes CI auth error 10000 on /zones/.../workers/routes).
# See README "Custom routes (dashboard)".
workers_dev = false

# Neon project: lucky-bonus-09897233 (Aipictors)
# Required secret:
# DATABASE_URL=postgresql://...

[vars]
STRIPE_WEBHOOK_PATH = "/webhooks/stripe"

# Required secrets / vars (set via `wrangler secret put` or dashboard)
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# INTERNAL_API_TOKEN
# ADMIN_API_TOKEN

# ユーザーがアップロードしたモデル（LoRA / チェックポイント）。非公開バケット、Worker 経由でのみ読み書きする
[[r2_buckets]]
binding = "USER_MODELS"
bucket_name = "aipictors-user-models"

# 日次コインの失効・付与（00:00 JST と、取りこぼし用に 00:30 JST）
[triggers]
crons = ["0 15 * * *", "30 15 * * *"]
