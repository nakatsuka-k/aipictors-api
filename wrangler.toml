name = "aipictors-api"
main = "src/index.ts"
compatibility_date = "2026-04-24"
account_id = "7f2a200bf2994f36f45e733751a30be6"
# Custom hostnames are configured in the Cloudflare Dashboard (not here) so `wrangler deploy`
# does not need Zone → Workers Routes on the API token (fixes CI auth error 10000 on /zones/.../workers/routes).
# See README "Custom routes (dashboard)".
workers_dev = false

# Neon project: lucky-bonus-09897233 (Aipictors)
