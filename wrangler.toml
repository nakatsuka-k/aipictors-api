name = "aipictors-api"
main = "src/index.ts"
compatibility_date = "2026-04-24"
account_id = "7f2a200bf2994f36f45e733751a30be6"
# Custom hostnames are configured in the Cloudflare Dashboard (not here) so `wrangler deploy`
# does not need Zone → Workers Routes on the API token (fixes CI auth error 10000 on /zones/.../workers/routes).
# See README "Custom routes (dashboard)".
workers_dev = false

# DB は D1（2026-11 に Neon から移行）。表の定義は migrations/gen・migrations/genlog
#   npx wrangler d1 migrations apply aipictors-gen --remote
#   npx wrangler d1 migrations apply aipictors-genlog --remote
[[d1_databases]]
binding = "DB"
database_name = "aipictors-gen"
database_id = "a6298c09-482c-428c-961b-1bec7980c8ba"
migrations_dir = "migrations/gen"

# 生成の依頼・結果・予約（大きいので別の DB）
[[d1_databases]]
binding = "GENLOG"
database_name = "aipictors-genlog"
database_id = "b0fcb116-e313-4743-a6ad-8b5790d0ecc2"
migrations_dir = "migrations/genlog"

[vars]
STRIPE_WEBHOOK_PATH = "/webhooks/stripe"
# 今プランに入っていない人（はじめて・おかえり）の初月半額（Stripe のクーポン ID。空にすると止まる）
FIRST_MONTH_COUPON_ID = "AIPICTORS_FIRST_MONTH_HALF"
# カード変更用の Stripe カスタマーポータル設定（カード変更・請求履歴のみ。解約は /plus から）
# Discord 連携: 実績のお祝いを投稿するチャンネル
DISCORD_CELEBRATION_CHANNEL_ID = "1566510587398066276"
BILLING_PORTAL_CONFIGURATION_ID = "bpc_1UWay5GjkGNUZhU2HQNasKRy"

# Required secrets / vars (set via `wrangler secret put` or dashboard)
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# INTERNAL_API_TOKEN
# ADMIN_API_TOKEN

# ユーザーがアップロードしたモデル（LoRA / チェックポイント）。非公開バケット、Worker 経由でのみ読み書きする
[[r2_buckets]]
binding = "USER_MODELS"
bucket_name = "aipictors-user-models"

# URL（Civitai）からのモデル取り込み。50MB ずつ Range で取得して USER_MODELS に multipart で保存する
# 任意 secret: CIVITAI_API_TOKEN（ログインが必要な LoRA の取り込みに使う。無ければそのモデルは取り込めないと表示する）
[[workflows]]
name = "aipictors-user-model-import"
binding = "USER_MODEL_IMPORTS"
class_name = "UserModelImportWorkflow"

# 日次コインの失効・付与（00:00 JST と、取りこぼし用に 00:30 JST）、解約予約中の人へのお知らせ（10:00 JST）
[triggers]
crons = ["0 15 * * *", "30 15 * * *", "0 1 * * *", "*/5 * * * *"]
